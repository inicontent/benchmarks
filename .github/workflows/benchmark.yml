name: Database benchmarks
on:
  workflow_dispatch:
    inputs:
      rows:
        description: Comma-separated record counts
        default: '1000,10000'
      repeats:
        description: Independent repetitions
        default: '3'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Run benchmark
        env:
          BENCH_ROWS: ${{ inputs.rows }}
          BENCH_REPEATS: ${{ inputs.repeats }}
        run: npm run bench -- --rows="$BENCH_ROWS" --repeats="$BENCH_REPEATS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/latest/
